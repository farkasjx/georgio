<!-- ════════════════════════════════
     MAP PAGE (fullscreen, fixed) — a site tartalmi kapcsolati térképe
     ════════════════════════════════ -->
<div id="page-map">
  <div class="map-shell" id="map-shell">
    <div class="canvas" id="map-canvas">
      <svg class="connections" id="map-svg"></svg>
    </div>

    <div class="map-toolbar">
      <button class="map-btn" id="btn-zoom-in">＋ Zoom</button>
      <button class="map-btn" id="btn-zoom-out">－ Zoom</button>
      <button class="map-btn" id="btn-reset">↺ Reset</button>
      <button class="map-btn map-chip chip-active" data-filter="all">Mind</button>
      <button class="map-btn map-chip" data-filter="workflow">Alapok & munkafolyamat</button>
      <button class="map-btn map-chip" data-filter="knowledge">Tudás & kontextus</button>
      <button class="map-btn map-chip" data-filter="model">Modell & hardver</button>
    </div>

    <div class="map-hint">Húzd az egeret · görgővel zoom · kattints egy csomópontra a megnyitáshoz</div>

    <!-- detail panel -->
    <div class="map-panel" id="map-panel">
      <button class="panel-close" id="panel-close">✕</button>
      <div class="panel-title" id="panel-title"></div>
      <div class="panel-time" id="panel-phase"></div>
      <div class="panel-desc" id="panel-desc"></div>
      <div class="panel-section-h">Kapcsolódó témák</div>
      <ul class="panel-list" id="panel-related"></ul>
      <button class="map-btn panel-open-btn" id="panel-open-btn">Megnyitás a tartalomban →</button>
    </div>
  </div>
</div>

<!-- ════════════════════════════════
     MAP PAGE (fullscreen, fixed)
     ════════════════════════════════ -->
<div id="page-map">
  <div class="map-shell" id="map-shell">
    <div class="canvas" id="map-canvas">
      <svg class="connections" id="map-svg"></svg>
    </div>

    <div class="map-toolbar">
      <button class="map-btn" id="btn-zoom-in">＋ Zoom</button>
      <button class="map-btn" id="btn-zoom-out">－ Zoom</button>
      <button class="map-btn" id="btn-reset">↺ Reset</button>
      <button class="map-btn map-chip chip-active" data-filter="all">Mind</button>
      <button class="map-btn map-chip" data-filter="1-3">Fázis 1–3</button>
      <button class="map-btn map-chip" data-filter="4-6">Fázis 4–6</button>
      <button class="map-btn map-chip" data-filter="7-10">Fázis 7–10</button>
    </div>

    <div class="map-hint">Húzd az egeret · görgővel zoom · kattints egy csomópontra</div>

    <!-- detail panel -->
    <div class="map-panel" id="map-panel">
      <button class="panel-close" id="panel-close">✕</button>
      <div class="panel-title" id="panel-title"></div>
      <div class="panel-time" id="panel-phase"></div>
      <div class="panel-desc" id="panel-desc"></div>
      <div class="panel-section-h">Szükséges tudás</div>
      <ul class="panel-list" id="panel-skills"></ul>
      <div class="panel-section-h">Eszközök</div>
      <ul class="panel-list" id="panel-tools"></ul>
      <div class="panel-section-h">Modul projekt</div>
      <p id="panel-project" style="font-size:13px;color:var(--text-muted);line-height:1.6;margin:0"></p>
    </div>
  </div>
</div>
